<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Страница не найдена — Курси Точик</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #080808;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
        text-align: center;
        padding: 24px;
      }

      .code {
        font-size: 15px;
        font-weight: 600;
        color: #7170ff;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      h1 {
        font-size: clamp(28px, 6vw, 40px);
        font-weight: 700;
        margin: 0 0 12px;
        line-height: 1.2;
      }

      p {
        font-size: 15px;
        color: #676d77;
        margin: 0 0 28px;
      }

      a.button {
        display: inline-block;
        background: #7170ff;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 9px;
      }

      a.button:hover {
        background: #828fff;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="code">404</div>
      <h1>Страница не найдена</h1>
      <p>Такой страницы не существует или она была перемещена.</p>
      <a class="button" href="/">На главную</a>
    </div>
  </body>
</html>
